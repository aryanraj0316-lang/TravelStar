# CI (docs/REMEDIATION.md Phase 11). Runs on every push / PR to main.
# Frontend: typecheck. Backend: typecheck, lint, build, and the integration
# suite against a throwaway Postgres service container.
#
# NOTE: the backend lint gate is `--max-warnings=0` and is enforced here.
# The frontend `npm run lint` gate is intentionally NOT wired yet — the
# repo has a large pre-existing violation backlog from the React Compiler
# rules (see the Phase 6 progress note in REMEDIATION.md); turn `lint-web`
# from `continue-on-error` to a hard gate once that backlog is burned down.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (advisory until the backlog is cleared)
        run: npm run lint
        continue-on-error: true

  backend:
    name: Backend API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travelstar
          POSTGRES_PASSWORD: travelstar
          POSTGRES_DB: travelstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travelstar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://travelstar:travelstar@localhost:5432/travelstar_test
      JWT_SECRET: ci_only_secret_0123456789abcdef0123456789abcdef
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --runInBand
